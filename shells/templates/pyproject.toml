[project]
name = "project"
version = "0.1.0"
description = "Python project"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Name", email = "email@example.com" },
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

# ==== #
# Ruff #
# ==== #

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".git", "__pycache__", ".venv", "venv", "dist", "build", "*.egg-info"]

[tool.ruff.lint]
# E/W  : pycodestyle
# F    : Pyflakes
# I    : isort
# UP   : pyupgrade
# B    : flake8-bugbear
# SIM  : flake8-simplify
# PT   : flake8-pytest-style
# RUF  : ruff specific
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "PT", "RUF",
    # "C4", "N", "RET", "PTH", "T20", "TRY", "A", "COM", "Q"
]

ignore = [
    "PT011",
    "PT019",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # Allow assert in tests
    "T20",    # Allow print in tests
]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ================ #
# Настройка Pytest
# ================ #

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = []
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]
