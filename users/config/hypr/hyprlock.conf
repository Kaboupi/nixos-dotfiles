general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = rgba(30, 30, 46, 1.0)

    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

label {
    monitor =
    text = $TIME
    color = rgb(205, 214, 244)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:43200000] date +"%A, %d %B"
    color = rgb(166, 227, 161)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    
    outer_color = rgb(137, 180, 250)
    inner_color = rgb(17, 17, 27)
    font_color = rgb(205, 214, 244)
    
    fade_on_empty = false
    placeholder_text = <i>👁️ Enter password...</i>
    hide_input = false

    check_color = rgb(250, 179, 135)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    
    position = 0, -120
    halign = center
    valign = center
}
