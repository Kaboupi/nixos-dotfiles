# Floating

windowrule {
  name = wr-yazi-floating
  float = on
  size = 1100 650
  center = on
  opacity = 0.95 0.85
  # dim_around = on
  match:class = ^(yazi_floating)$
}

windowrule {
  name = wr-loupe
  float = on
  center = on
  match:class = ^(loupe)$
}

windowrule {
  name = wr-mpv-fullscreen
  keep_aspect_ratio = on
  idle_inhibit = focus
  match:class = ^(mpv)$
}

