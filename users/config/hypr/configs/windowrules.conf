general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffff) rgba(00ff99ff) 45deg
    col.inactive_border = rgba(595959aa)

    # Force the core engine layout
    layout = dwindle
}

dwindle {
    force_split = 0
    preserve_split = true
    smart_split = false
}

# Floating

windowrule {
  name = windowrule-floating
  float = on
  match:class = ^(loupe)$
}

windowrule {
  name = windowrule-thunar-copy
  float = on
  match:class = ^(thunar)$
  match:title = ^(File Operation Progress)$
}

windowrule {
  name = windowrule-clock
  float = on
  match:class = ^(terminal_clock)$
}

# Size & center

windowrule {
  name = windowrule-6
  size = 900 600
  match:class = ^(thunar)$
}

windowrule {
  name = windowrule-7
  size = 450 250
  center = on
  match:class = ^(terminal_clock)$
}

windowrule {
  name = windowrule-8
  center = on
  match:class = ^(loupe)$
}

# Blur & opacity

windowrule {
  name = windowrule-9
  opacity = 0.97 0.73
  match:class = ^(kitty)$
}

layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0.5
  match:namespace = rofi
}
