# NOTE: based on Restore and save Nix Store v7
name: "Test NixOS with advanced caching"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Nix cache
        uses: nix-community/cache-nix-action@v7
        id: nix-cache
        with:
          primary-key: nix-${{ runner.os }}-lint-${{ hashFiles('**.nix', '**/flake.lock', '**/flake.nix') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-lint-
            nix-${{ runner.os }}-
            nix-
          restore-prefixes-all-matches: |
            nix-${{ runner.os }}-lint-
            nix-${{ runner.os }}-
            nix-
          lookup-only: ${{ github.event_name == 'pull_request' }}
          gc-max-store-size: 4G
          backend: actions

      - name: Show cache status
        run: |
          echo "Cache restored: ${{ steps.nix-cache.outputs.cache-restored }}"
          echo "Primary key: ${{ steps.nix-cache.outputs.primary-key }}"

      - name: Lint Nix files
        run: |
          make lint

  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: lint
    if: success() || failure()
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Nix cache
        uses: nix-community/cache-nix-action@v7
        id: nix-cache
        with:
          primary-key: nix-${{ runner.os }}-build-${{ hashFiles('**.nix', '**/flake.lock', '**/flake.nix') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-build-
            nix-${{ runner.os }}-
            nix-
          restore-prefixes-all-matches: |
            nix-${{ runner.os }}-build-
            nix-${{ runner.os }}-
            nix-
          lookup-only: ${{ github.event_name == 'pull_request' }}
          gc-max-store-size: 8G
          backend: actions

      - name: Show cache status
        run: |
          echo "Cache restored: ${{ steps.nix-cache.outputs.cache-restored }}"
          echo "Primary key: ${{ steps.nix-cache.outputs.primary-key }}"

      - name: Build configurations
        run: |
          make build-all-hosts

      - name: Clean up after build
        if: always()
        run: |
          nix-collect-garbage --max-freed 2G || true

  check:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: build
    if: success() || failure()
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Nix cache
        uses: nix-community/cache-nix-action@v7
        id: nix-cache
        with:
          primary-key: nix-${{ runner.os }}-check-${{ hashFiles('**.nix', '**/flake.lock', '**/flake.nix') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-check-
            nix-${{ runner.os }}-build-
            nix-${{ runner.os }}-
            nix-
          restore-prefixes-all-matches: |
            nix-${{ runner.os }}-check-
            nix-${{ runner.os }}-build-
            nix-${{ runner.os }}-
            nix-
          lookup-only: ${{ github.event_name == 'pull_request' }}
          gc-max-store-size: 8G
          backend: actions

      - name: Show cache status
        run: |
          echo "Cache restored: ${{ steps.nix-cache.outputs.cache-restored }}"
          echo "Primary key: ${{ steps.nix-cache.outputs.primary-key }}"

      - name: Run flake check
        run: |
          make check

      - name: Clean up after check
        if: always()
        run: |
          nix-collect-garbage --max-freed 2G || true

  finalize:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [lint, build, check]
    if: always()
    steps:
      - name: Check overall status
        run: |
          echo "All jobs completed!"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Check: ${{ needs.check.result }}"
          
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]] || \
             [[ "${{ needs.check.result }}" == "failure" ]]; then
            echo "Some jobs failed!"
            exit 1
          else
            echo "🎉 All checks passed!"
          fi
